[project]
name = "mlops"
version = "0.1.0"
description = "MLOps template with Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "kaggle>=1.5",
    "matplotlib>=3.7",
    "polars>=0.20",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "lightgbm>=4.6.0",
    "torchvision>=0.15",
    "grad-cam>=1.5",
    "Pillow>=10.0",
    "jinja2>=3.1",
    "google-cloud-storage>=2.0",
    "google-cloud-aiplatform>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mille>=0.0.14",
    "ty>=0.0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
