# @package _global_
# 学習済みモデルを Kaggle Dataset にアップロードする設定
#
# 実行: uv run python -m src usecase=upload_job_models
usecase: update_source_dataset

source_dataset:
  src_dir: models/titanic/titanic_lgbm/latest
  conf_dir: models/titanic/titanic_lgbm/latest
  dataset_slug: titanic-vertex-models
  title: titanic-vertex-models
  license_name: CC0-1.0
  ignorefile: .kaggleignore
  extra_dirs: []
  version_message: "job trained model"

staging_dir: .staging
