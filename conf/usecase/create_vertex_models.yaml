# @package _global_
# Vertex AI 学習済みモデルの Kaggle Dataset を初回作成する設定
#
# 実行: uv run python -m src usecase=create_vertex_models
usecase: create_source_dataset

source_dataset:
  src_dir: models/titanic/titanic_lgbm/latest
  conf_dir: models/titanic/titanic_lgbm/latest
  dataset_slug: titanic-vertex-models
  title: titanic-vertex-models
  license_name: CC0-1.0
  kaggleignore: .kaggleignore
  extra_dirs: []
  version_message: "initial: vertex AI trained model"

staging_dir: .staging
