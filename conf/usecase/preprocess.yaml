# @package _global_
# 前処理パイプライン設定のデフォルト値
# ユーザーはこのファイルをコピーして各ジョブ用に編集する

usecase: preprocess

job_id: my_preprocess  # 省略時は timestamp 自動生成

# 入力データソース（複数可）
inputs:
  - id: raw_train
    path: ???  # 必須: data/raw/train.csv など
    format: csv  # csv / parquet / jsonl

output_dir: data/processed  # yaml/html も同じ場所に保存（*.yaml, *.html は .gitignore で除外対象外）

executor:
  type: local  # local / ray_local / gcp_vertex / gcp_dataflow / aws_sagemaker / aws_emr

cv:
  strategy: none  # none / kfold / time_series / stratified_kfold / group_kfold / stratified_group_kfold / leave_one_group_out
  n_splits: 5
  time_col: null
  target_col: null   # stratified_kfold / stratified_group_kfold で使用
  group_col: null    # group_kfold / stratified_group_kfold / leave_one_group_out で使用
  input_id: null     # CV に使う input の id（null = 最初の input）

# 変換ステップ（例）
steps: []

# 実行するターゲットノード（空の場合は全 output ノードを実行）
targets: []

seed: 42
