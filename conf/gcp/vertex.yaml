# @package _global_
# GCP 設定 — 値は .env から読み込む（プレースホルダーを直接書き換えないこと）
gcp:
  project: ${oc.env:GCP_PROJECT}
  region: ${oc.env:GCP_REGION,asia-northeast1}
  staging_bucket: gs://${oc.env:GCP_BUCKET_NAME,${oc.env:GCP_PROJECT}-mlops-staging}
  machine_type: n1-standard-4                         # vCPU 4 / RAM 15GB
  accelerator_type: null                              # GPU使用時: NVIDIA_TESLA_T4
  accelerator_count: 0
  service_account: training-sa@${oc.env:GCP_PROJECT}.iam.gserviceaccount.com
  # Kaggle プリビルトイメージ（ML ライブラリが全部入り。Docker ビルド不要）
  # GPU 使用時は gcr.io/kaggle-gpu-images/python に変更する
  container_uri: gcr.io/kaggle-images/python:latest
