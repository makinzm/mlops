# @package _global_
gcp:
  project: my-gcp-project                              # GCP プロジェクト ID
  region: asia-northeast1                              # 東京リージョン（変更可）
  staging_bucket: gs://my-project-mlops-staging       # terraform output bucket_name を設定
  container_uri: asia-northeast1-docker.pkg.dev/my-project/mlops/training:latest
  machine_type: n1-standard-4                         # vCPU 4 / RAM 15GB
  accelerator_type: null                              # GPU使用時: NVIDIA_TESLA_T4
  accelerator_count: 0
  service_account: training-sa@my-project.iam.gserviceaccount.com
  budget_action: warn                                 # "warn": 通知のみ / "stop": ジョブ停止
