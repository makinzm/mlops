# @package _global_
# Titanic 学習設定 — Target Encoding 前処理済みデータ用
# preprocess recipe=target_encoding の出力を入力として使用する。
#
# target_encoding.yaml では Sex, Embarked が float にエンコードされているため、
# categorical_feature から除外している。

usecase: train
job_id: titanic_lgbm_with_target_encoding
trainer:
  type: lgbm

# ── 入力 ──────────────────────────────────────────
# "latest" を指定すると output_dir/job_id/ 配下の最新タイムスタンプを自動選択
preprocess_output_dir: ${oc.env:MLOPS_DATA_DIR,data/2026/Q1/processed/titanic_preprocess_target_encoding/latest/train_out}
target_col: Survived
feature_cols:
  - Pclass
  - Age
  - SibSp
  - Parch
  - Fare
  - FamilySize
  - Sex
  - Embarked
# NOTE: 前処理 recipe=target_encoding が Sex, Embarked を float にエンコードする想定だが、
# 現状の preprocess パイプラインではエンコードされないため categorical_feature に含める。
# Target Encoding が正しく実装された際はこの設定を [] に戻すこと。
categorical_feature:
  - Sex
  - Embarked

# ── サンプル重み ─────────────────────────────────
sample_weight_col: null

# ── 損失 / 評価 ──────────────────────────────────
loss:
  objective: binary
  metric: auc
  is_unbalance: false
  class_weight: null

# ── LightGBM ハイパーパラメータ ──────────────────
lgbm:
  num_leaves: 31
  max_depth: -1
  learning_rate: 0.05
  n_estimators: 1000
  feature_fraction: 0.9
  bagging_fraction: 0.8
  bagging_freq: 5
  min_child_samples: 20
  reg_alpha: 0.0
  reg_lambda: 0.0
  verbose: -1
  early_stopping_rounds: 50

# ── モデルレポート ────────────────────────────────
report:
  n_error_samples: 50

# ── 学習環境 ──────────────────────────────────────
environment:
  device: cpu
  n_jobs: -1

# ── ログ ─────────────────────────────────────────
logging:
  eval_freq: 100
  save_importance: true

output_dir: ${oc.env:MLOPS_MODEL_DIR,models/${competition.name}}
seed: 42
