# @package _global_
# Titanic Vertex AI パイプライン設定 — Vertex AI 学習から Kaggle 提出まで
#
# 実行例:
#   uv run python -m src usecase=pipeline recipe=vertex_to_kaggle
usecase: pipeline
job_id: titanic_vertex_to_kaggle

steps:
  # ① 前処理
  - usecase: preprocess
    recipe: base

  # ② Vertex AI で学習
  - usecase: vertex_train
    recipe: lgbm

  # ③ 推論（submission.csv 生成）
  - usecase: inference
    recipe: titanic_ensemble

  # ④ コード（src + conf）を既存 Dataset に push
  - usecase: update_source_dataset
    source_dataset:
      version_message: "auto update: vertex training"

  # ⑤ 最新モデル重みを別の Dataset に push（latest → 最新タイムスタンプを自動解決）
  - usecase: update_source_dataset
    source_dataset:
      dataset_slug: titanic-vertex-models
      title: titanic-vertex-models
      src_dir: models/titanic/titanic_lgbm/latest
      conf_dir: models/titanic/titanic_lgbm/latest
      extra_dirs: []
      version_message: "auto update: vertex trained model"

  # ⑥ 推論専用 Notebook を push（学習しない）
  - usecase: push_notebook
    notebook:
      kernel_slug: titanic-vertex-inference
      recipe: inference_only
      src_dataset: mlops-pipeline-src
      extra_datasets:
        - slug: titanic-vertex-models
          mount_path: /kaggle/working/models/titanic/titanic_lgbm
      competition: titanic
      enable_gpu: false
      enable_internet: false
