# @package _global_
# Titanic Vertex AI Fire-and-Forget パイプライン設定
# 前処理 -> Vertex AI ジョブ非同期送信 -> 即終了
#
# 実行例:
#   uv run python -m src usecase=pipeline recipe=vertex_fire_and_forget
usecase: pipeline
job_id: titanic_vertex_fire_and_forget

steps:
  # (1) 前処理
  - usecase: preprocess
    recipe: base

  # (2) Vertex AI ジョブ非同期送信（即座に終了）
  - usecase: vertex_submit
    recipe: lgbm
