# @package _global_
# Titanic Vertex AI ダウンロード → Kaggle 提出パイプライン設定
# Slack/Email 通知を受けた後に実行する
#
# 実行例:
#   uv run python -m src usecase=pipeline recipe=vertex_download_and_push
usecase: pipeline
job_id: titanic_vertex_download_and_push

# Dataset slug を一箇所で管理し、step 間の不整合を防ぐ
_datasets:
  src: mlops-pipeline-src-2
  models: titanic-vertex-models-2

steps:
  # (1) Vertex AI からモデルダウンロード
  - usecase: vertex_download

  # (2) コードを既存 Dataset に push（upsert: 初回は自動作成）
  - usecase: update_source_dataset
    source_dataset:
      dataset_slug: ${_datasets.src}
      title: ${_datasets.src}
      version_message: "auto update: vertex download and push"

  # (3) モデル重みを別の Dataset に push（upsert: 初回は自動作成）
  - usecase: update_source_dataset
    source_dataset:
      dataset_slug: ${_datasets.models}
      title: ${_datasets.models}
      src_dir: models/titanic/titanic_lgbm/latest
      conf_dir: models/titanic/titanic_lgbm/latest
      extra_dirs: []
      version_message: "auto update: vertex trained model"

  # (4) 推論専用 Notebook を push
  - usecase: push_notebook
    notebook:
      kernel_slug: titanic-vertex-inference-2
      recipe: inference_only
      src_dataset: ${_datasets.src}
      extra_datasets:
        - slug: ${_datasets.models}
          mount_path: /kaggle/working/models/titanic
      competition: titanic
      enable_gpu: false
      enable_internet: false
