defaults:
  - _self_
  - competition: titanic
  - usecase: download

# recipe= で競技固有設定を選択するための共通パラメータ
# 例: uv run python -m src usecase=preprocess recipe=base
recipe: null

# push_notebook usecase 用パラメータ（usecase=push_notebook 時に上書きされる）
# caution.md: conf/config.yaml に宣言していないキーは CLI から渡せない
notebook: null
platform_username: null

# create/update_source_dataset usecase 用パラメータ
source_dataset: null
staging_dir: null

# job_train / job_submit / job_download usecase 用パラメータ
# caution.md: conf/config.yaml に宣言していないキーは CLI から渡せない
infra: null
job_id: null

# job_submit / job_download usecase 用パラメータ
# caution.md: conf/config.yaml に宣言していないキーは CLI から渡せない
notification: null
manifest_path: null
job_history_dir: job_history

# pipeline yaml 内でのローカル変数（Dataset slug 等の共有用）
_datasets: null

# gradcam usecase 用パラメータ
gradcam: null
