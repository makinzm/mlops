pre-commit:
  parallel: true
  commands:
    mille-check:
      run: uv run mille check
    ruff-check:
      run: uv run ruff check .
    ruff-format:
      run: uv run ruff format --check .
    mypy:
      run: uv run mypy tests/ src/
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint
