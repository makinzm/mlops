pre-commit:
  parallel: true
  commands:
    requirements-sync:
      glob: "{pyproject.toml,uv.lock}"
      run: uv export --no-hashes --no-dev --no-editable 2>/dev/null | grep -v "^\." > requirements.txt && git add requirements.txt
    mille-check:
      run: uv run mille check
    ruff-check:
      run: uv run ruff check .
    ruff-format:
      run: uv run ruff format --check .
    mypy:
      run: uv run mypy tests/ src/
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint
