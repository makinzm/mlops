name: Manual Kaggle Submit

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model name to use for inference'
        required: true
        default: 'latest'
      message:
        description: 'Submission message'
        required: false
        default: 'Manual submission'

env:
  CI: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  KAGGLE_COMPETITION: ${{ vars.KAGGLE_COMPETITION }}
  KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: make sync EXTRA=kaggle

      - name: Configure Kaggle
        run: make kaggle-setup
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Model from GCS
        run: make gcp-download-model MODEL=${{ inputs.model_name }}

      - name: Run Inference and Submit
        run: make kaggle-inference-submit MSG="${{ inputs.message }}"
