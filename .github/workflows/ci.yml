name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install --accept-flake-config nixpkgs#devenv
      - run: devenv shell -- uv run --extra dev ruff check .
      - run: devenv shell -- uv run --extra dev ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install --accept-flake-config nixpkgs#devenv
      - run: devenv shell -- uv run --extra dev mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install --accept-flake-config nixpkgs#devenv
      - run: devenv shell -- uv run --extra dev pytest --cov=src --cov-report=xml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install --accept-flake-config nixpkgs#devenv
      - run: devenv shell -- actionlint .github/workflows/ci.yml
