name: CD - Deploy and Train

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_training:
        description: 'Skip Vertex AI training'
        type: boolean
        default: false

env:
  CI: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  KAGGLE_COMPETITION: ${{ vars.KAGGLE_COMPETITION }}
  KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}

jobs:
  # ==========================================================================
  # Job 1: Push to Kaggle (Dataset + Models) - runs in parallel
  # ==========================================================================
  kaggle-push:
    name: Push to Kaggle
    runs-on: ubuntu-latest
    outputs:
      dataset_version: ${{ steps.push-dataset.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: make sync EXTRA=kaggle

      - name: Configure Kaggle
        run: make kaggle-setup
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}

      - name: Push Dataset to Kaggle
        id: push-dataset
        run: |
          make kaggle-push-dataset MSG="Commit: ${{ github.sha }}"
          echo "version=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Job 2: Train on Vertex AI - runs in parallel
  # ==========================================================================
  vertex-train:
    name: Train on Vertex AI
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_training }}
    permissions:
      contents: read
      id-token: write

    outputs:
      model_uri: ${{ steps.train.outputs.model_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Training Image
        run: make gcloud-build TAG=${{ github.sha }}

      - name: Submit Vertex AI Training Job
        id: train
        run: |
          make gcp-train TAG=${{ github.sha }}
          # Wait for job completion (simplified - production should poll status)
          sleep 60
          # Get model URI from GCS
          MODEL_URI="gs://${{ env.GCP_PROJECT_ID }}-mlops-dev/models/latest/model.pkl"
          echo "model_uri=$MODEL_URI" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Job 3: Auto Submit to Kaggle (after both jobs complete)
  # ==========================================================================
  kaggle-submit:
    name: Submit to Kaggle
    needs: [kaggle-push, vertex-train]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: make sync EXTRA=kaggle

      - name: Configure Kaggle
        run: make kaggle-setup
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Model from GCS
        run: make gcp-download-model MODEL=latest

      - name: Run Inference and Submit
        run: make kaggle-inference-submit MSG="auto-${{ github.sha }}"
